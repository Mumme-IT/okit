[tools]
python = "3.10"

[tasks."okit:install"]
description = "Install okit in editable mode"
run = "pip install -e .[dev]"
sources = ["pyproject.toml"]
outputs = [".venv/okit.egg-link"]

[tasks.test]
description = "Run pytest"
depends = ["okit:install"]
run = "python -m pytest tests/"

[tasks.okit]
description = "Run okit CLI"
depends = ["okit:install"]
run = "python -m okit"
raw = true

[tasks."version:update"]
description = "Update version in pyproject.toml and okit/__init__.py"
run = '''
#!/usr/bin/env bash
set -euo pipefail
NEW_VERSION="${1:?Usage: mise run version:update <new_version>}"
sed -i '' "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
sed -i '' "s/^__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" okit/__init__.py
echo "✓ Updated version to $NEW_VERSION in pyproject.toml and okit/__init__.py"
'''
