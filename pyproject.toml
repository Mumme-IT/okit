[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okit"
version = "0.5.3"
description = "CLI for managing OpenCode skills and agents from Git repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["prompt_toolkit>=3.0"]
authors = [{ name = "okit contributors" }]
keywords = ["opencode", "skills", "agents", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
okit = "okit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
